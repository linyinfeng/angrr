[workspace]
resolver = "3"
members = ["angrr", "xtask"]

[workspace.package]
version = "0.2.8"
edition = "2024"
license = "MIT"
authors = ["Lin Yinfeng <lin.yinfeng@outlook.com>"]
homepage = "https://github.com/linyinfeng/angrr"
repository = "https://github.com/linyinfeng/angrr"

[workspace.dependencies]
anyhow = "1"
clap = "4"
clap_complete = "4"
clap_mangen = "0.3"
dialoguer = "0.12"
env_logger = "0.11"
figment = "0.10"
humantime = "2"
humantime-serde = "1"
ignore = "0.4"
log = "0.4"
nix = "0.31"
regex = "1"
rust-embed = "8"
serde = "1"
serde_default = "0.2"
serde_json = "1"
serde_regex = "1"
subprocess = "1"
toml = "1"
uzers = "0.12"
xshell = "0.2"
